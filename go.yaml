log:
  level: info
  filename: ./logs/default.log
  maxsize: 100
  maxbackups: 3
  maxage: 30
  isstacktrace: true
  isstdout: true

roots:
  - /root/go/2
  - /root/go/5
excludeSuffix:
  - .log
  - .torrent
  - .llc
  - .swp
  - .swx
  - 4913
  - "~"
dumpPath: ./index.db
account: admin
password: admin
jwtSecret: your-super-secret-key-here-2024
walPath: ./index.wal
wALThreshold: 100